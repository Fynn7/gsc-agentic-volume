name: tests

# The documented gate (scripts/volume_tui/README.md): the TUI test suite and
# a byte-compile of the package. Windows, because the TUI, the launcher and
# the C++ raycaster are Windows-only (msvcrt, PowerShell, Raycaster.exe).
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tui-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            scripts/volume_tui/requirements.txt
            scripts/volume_context/requirements.txt
      - name: Install the pinned dependencies
        run: |
          python -m pip install -r scripts/volume_tui/requirements.txt
          python -m pip install -r scripts/volume_context/requirements.txt
      - name: Run the test suite
        # No test starts a model, renderer or network service.
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Byte-compile the TUI package
        run: python -B -m compileall -q scripts/volume_tui
