<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic Volume Visualization</title>
<style>body{font:16px system-ui;margin:24px;max-width:1200px;background:#15191f;color:#eef2f6}input,textarea,button{font:inherit;padding:10px;margin:6px 0;box-sizing:border-box}input,textarea{width:100%;background:#222a34;color:inherit;border:1px solid #8391a1}button{cursor:pointer}main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);gap:24px}img{width:100%;max-width:512px}pre{white-space:pre-wrap;overflow-wrap:anywhere}figure{margin:0 0 24px}details{margin:16px 0}#status{padding:12px;background:#283443}@media(max-width:700px){main{display:block}}</style>
<h1>Agentic Volume Visualization</h1><p>Local Windows Native Renderer · Ollama visual feedback · Phase 1 prototype</p><main><section>
<label>Local volume header path<input id="source" placeholder="D:\data\volume.dat"></label><label>Installed local vision model<input id="model" value="qwen3.5:9b"></label><label>Visualization task<textarea id="goal" rows="4" placeholder="Describe what you want to see"></textarea></label>
<button id="start">Import and explore</button> <button id="stop" disabled>Stop</button> <button id="continue" disabled>Continue</button><p id="status" role="status">Ready</p><p>Two decisions per segment; four total. Model claims remain unverified. Unknown anatomical orientation stays unknown.</p><details><summary>Current Scene State</summary><pre id="scene"></pre></details><h2>Actual exploration</h2><div id="events"></div>
</section><section><h2>Actual renderer frames</h2><div id="frames"></div></section></main>
<script>
let current=null,timer=null; const el=id=>document.getElementById(id);
async function post(route,body){let r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
function text(tag,value){let n=document.createElement(tag);n.textContent=value;return n}
async function refresh(){if(!current)return;let r=await fetch('/api/session/'+current),s=await r.json();el('status').textContent=s.state+' · decisions '+s.used+'/'+s.budget;el('scene').textContent=JSON.stringify(s.scene,null,2);el('stop').disabled=s.state!=='running';el('continue').disabled=s.state!=='paused';el('start').disabled=s.state==='running';el('events').replaceChildren();el('frames').replaceChildren();for(let event of s.events){let row=document.createElement('details');row.append(text('summary',event.seq+' · '+event.kind+(event.action?' · '+event.action.tool:'')));row.append(text('pre',JSON.stringify(event,null,2)));el('events').append(row);if(event.result){let f=document.createElement('figure'),im=document.createElement('img');let rel=event.result.image.replaceAll('\\','/').split('/runtime/')[1];im.src='/artifact/'+rel;im.alt='Actual native screenshot, scene revision '+event.result.scene.revision;f.append(im,text('figcaption','Scene '+event.result.scene.revision+' · '+event.result.imageSha256.slice(0,12)+' · task correctness unverified'));el('frames').append(f)}}}
el('start').onclick=async()=>{try{let s=await post('start',{source:el('source').value,model:el('model').value,goal:el('goal').value});current=s.id;await refresh();clearInterval(timer);timer=setInterval(()=>refresh().catch(e=>el('status').textContent=e.message),1500)}catch(e){el('status').textContent=e.message}};
el('stop').onclick=()=>post('stop',{id:current}).catch(e=>el('status').textContent=e.message);el('continue').onclick=()=>post('continue',{id:current}).catch(e=>el('status').textContent=e.message);
</script></html>
